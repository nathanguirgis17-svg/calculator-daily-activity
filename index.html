<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple calculator for everyday arithmetic.">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <p class="subtitle">A simple tool for everyday math</p>

    <output class="display" id="display" aria-live="polite" aria-atomic="true">0</output>

    <div class="buttons" aria-label="Calculator buttons">
      <button class="clear" data-action="clear" type="button">AC</button>
      <button class="operator" data-operator="/" type="button" aria-label="Divide">÷</button>
      <button class="operator" data-operator="*" type="button" aria-label="Multiply">×</button>
      <button class="operator" data-operator="-" type="button" aria-label="Subtract">−</button>

      <button data-digit="7" type="button">7</button>
      <button data-digit="8" type="button">8</button>
      <button data-digit="9" type="button">9</button>
      <button class="operator" data-operator="+" type="button" aria-label="Add">+</button>

      <button data-digit="4" type="button">4</button>
      <button data-digit="5" type="button">5</button>
      <button data-digit="6" type="button">6</button>
      <button class="equals" data-action="equals" type="button" aria-label="Equals">=</button>

      <button data-digit="1" type="button">1</button>
      <button data-digit="2" type="button">2</button>
      <button data-digit="3" type="button">3</button>
      <button class="zero" data-digit="0" type="button">0</button>
      <button data-action="decimal" type="button" aria-label="Decimal point">.</button>
    </div>
    <p class="hint">Tip: you can also use your keyboard.</p>
  </main>
</body>
</html>
